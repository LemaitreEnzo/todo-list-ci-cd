name: CI

on:
  push:
    branches:
      - dev
      - staging
      - main
  pull_request:
    branches:
      - dev
      - staging
      - main

permissions:
  contents: read

jobs:
  ci-pipeline:
    name: Continuous Integration (Audit, Lint, Test & Build)
    runs-on: ubuntu-latest

    # Service externe : Conteneur Redis pour démontrer l'utilisation des services dans GitHub Actions
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js with cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm" # Gestion du cache npm via actions/setup-node

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies (Security)
        run: npm audit --audit-level=high

      - name: Code quality (Linting)
        run: npm run lint

      - name: Code quality (TypeScript verification)
        run: npm run typecheck

      - name: Run automated tests with coverage
        run: npm run test:coverage

      - name: Build application
        run: npm run build

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Upload production build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist-build
          path: dist/
          retention-days: 7
